<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Tree Chat System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌳 Conversation Tree Chat System</h1>
            <p class="subtitle">Branch off from any point to explore related concepts</p>
        </header>

        <div class="main-content">
            <!-- Chat View -->
            <div class="chat-section">
                <div class="breadcrumb" id="breadcrumb"></div>
                
                <div class="chat-container" id="chatContainer">
                    <!-- Messages will be dynamically added here -->
                </div>

                <div class="input-section">
                    <input type="text" id="messageInput" placeholder="Type your message...">
                    <button id="sendBtn">Send</button>
                    <button id="returnToMainBtn" class="secondary">↩ Return to Main</button>
                </div>
            </div>

            <!-- Tree Map Sidebar -->
            <div class="sidebar">
                <h2>🗺️ Conversation Map</h2>
                <div class="tree-legend" id="treeLegend">
                    <!-- Tree visualization will be rendered here -->
                </div>
                <div class="legend-help">
                    <p><strong>Legend:</strong></p>
                    <ul>
                        <li>🔵 Main thread</li>
                        <li>🟢 Current location</li>
                        <li>⚪ Other branches</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="conversation-tree.js"></script>
    <script src="app.js"></script>
</body>
</html>
